name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "supabase/**"
      - "apps/acars-connector/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Verificar configuración
        run: |
          missing=0
          [ -n "$VITE_SUPABASE_URL" ] || { echo "::error::Falta la variable de repositorio VITE_SUPABASE_URL"; missing=1; }
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || { echo "::error::Falta la variable de repositorio VITE_SUPABASE_PUBLISHABLE_KEY"; missing=1; }
          exit $missing
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Comprobar que no hay claves secretas en el sitio
        run: |
          if grep -rlE "sb_secret_[A-Za-z0-9]" apps/web/dist; then
            echo "::error::El build contiene una clave secreta de Supabase"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
