name: Prueba del sitio publicado

# Abre el sitio de GitHub Pages en Chromium después de cada publicación:
# 1. Comprobaciones públicas contra la base real (carga, rutas, Supabase, CSP).
# 2. Revisión visual de las pantallas con sesión usando datos simulados en el
#    navegador (no toca la base real).
# Las capturas se guardan en la rama ci/smoke-screenshots.
on:
  workflow_run:
    workflows: ["Publicar en GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Fijo en 24.04: Playwright 1.55 no instala dependencias en la imagen de Ubuntu 26.
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://inavae.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Esperar a que Pages sirva la versión nueva
        run: sleep 30
      - name: Comprobaciones públicas
        # Los scripts se copian junto a node_modules de Playwright para que el
        # import lo resuelva; las capturas quedan en el directorio de trabajo.
        run: |
          cp scripts/smoke-test.mjs "$RUNNER_TEMP/pw/smoke-test.mjs"
          node "$RUNNER_TEMP/pw/smoke-test.mjs"
      - name: Revisión visual con sesión (datos simulados)
        if: always()
        run: |
          cp scripts/visual-check.mjs "$RUNNER_TEMP/pw/visual-check.mjs"
          node "$RUNNER_TEMP/pw/visual-check.mjs"
      - name: Guardar capturas en la rama ci/smoke-screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          for f in smoke-screenshots/*.png; do [ -e "$f" ] && cp "$f" "$RUNNER_TEMP/shots/"; done
          for f in visual-screenshots/*.png; do [ -e "$f" ] && cp "$f" "$RUNNER_TEMP/shots/v-$(basename "$f")"; done
          ls "$RUNNER_TEMP"/shots/*.png >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci/smoke-screenshots
          git rm -rfq .
          cp "$RUNNER_TEMP"/shots/*.png .
          echo "Capturas de la prueba del commit ${GITHUB_SHA} (${GITHUB_RUN_ID})." > README.md
          git add -A
          git commit -qm "Capturas de la prueba del sitio ${GITHUB_RUN_ID}"
          git push -f origin ci/smoke-screenshots
