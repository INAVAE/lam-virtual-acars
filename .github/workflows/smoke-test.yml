name: Prueba del sitio publicado

# Abre el sitio de GitHub Pages en Chromium después de cada publicación y
# comprueba carga, rutas, conexión con Supabase y formularios. Las capturas
# se guardan en la rama ci/smoke-screenshots para revisión visual.
on:
  workflow_run:
    workflows: ["Publicar en GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://inavae.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Esperar a que Pages sirva la versión nueva
        run: sleep 30
      - name: Ejecutar comprobaciones
        # El script se copia junto a node_modules de Playwright para que el
        # import lo resuelva; las capturas quedan en el directorio de trabajo.
        run: |
          cp scripts/smoke-test.mjs "$RUNNER_TEMP/pw/smoke-test.mjs"
          node "$RUNNER_TEMP/pw/smoke-test.mjs"
      - name: Guardar capturas en la rama ci/smoke-screenshots
        if: always()
        run: |
          [ -d smoke-screenshots ] || exit 0
          cp -r smoke-screenshots "$RUNNER_TEMP/shots"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci/smoke-screenshots
          git rm -rfq .
          cp "$RUNNER_TEMP"/shots/*.png .
          echo "Capturas de la prueba del commit ${GITHUB_SHA} (${GITHUB_RUN_ID})." > README.md
          git add -A
          git commit -qm "Capturas de la prueba del sitio ${GITHUB_RUN_ID}"
          git push -f origin ci/smoke-screenshots
