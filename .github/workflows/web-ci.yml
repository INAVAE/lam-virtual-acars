name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No hay pnpm-lock.yaml; ejecuta el flujo 'Actualizar lockfile'."
            pnpm install --no-frozen-lockfile
          fi
      - name: Contrato ACARS sincronizado
        run: scripts/ci-run.sh "Contrato ACARS" cmp packages/validation/src/acars.ts supabase/functions/acars/contract.ts
      - run: scripts/ci-run.sh Tipos pnpm typecheck
      - run: scripts/ci-run.sh Lint pnpm lint
      - run: scripts/ci-run.sh Pruebas pnpm test
      - name: Build
        run: scripts/ci-run.sh Build pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verificar fallback SPA
        run: test -f apps/web/dist/404.html
